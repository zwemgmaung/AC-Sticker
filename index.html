<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker - Full Precision Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #1a1a1a; text-align: center; color: white; }
        .container { max-width: 600px; margin: auto; background: #2d2d2d; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .section { text-align: left; margin-bottom: 15px; padding: 12px; border: 1px solid #444; border-radius: 10px; background: #333; }
        h3 { color: #4caf50; margin-top: 0; font-size: 15px; border-bottom: 1px solid #555; padding-bottom: 5px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 12px; color: #ccc; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; font-size: 14px; background: #fff; color: #333; box-sizing: border-box; margin-bottom: 10px; appearance: auto; }
        .control-group { background: #444; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 11px; color: #4caf50; margin-bottom: 2px; }
        input[type="range"] { width: 100%; margin: 5px 0; }
        button { color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-bulk { background: #1a73e8; margin-bottom: 10px; }
        .btn-single { background: #28a745; }
        #status { margin-top: 10px; font-size: 12px; color: #ffeb3b; }
        #preview { width: 100%; border-radius: 8px; border: 1px solid #444; margin-top: 10px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #4caf50; margin-top: 0;">CITY SCHOOL Sticker Fix</h2>

    <div class="section">
        <h3>၁။ ဒေတာထည့်ရန်</h3>
        <select id="template">
            <option value="1000158560.png" selected>Outdoor Unit</option>
            <option value="1000158556.png">Indoor Unit</option>
        </select>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <input type="text" id="unitId" value="CU G-01">
            <input type="text" id="room" value="Control Room">
            <input type="text" id="brand" value="SUMMIT">
            <input type="text" id="type" value="Wall">
            <input type="text" id="cooling" value="2">
            <input type="text" id="refrigerant" value="R-32a">
        </div>
    </div>

    <div class="section">
        <h3>၂။ စာသားအနိမ့်အမြင့် ဘယ်ညာချိန်ရန် (Sliders)</h3>
        <div class="control-group">
            <div class="slider-label"><span>ဘယ်/ညာ (X)</span> <span id="valX">480</span></div>
            <input type="range" id="sliderX" min="300" max="700" value="480">
            
            <div class="slider-label"><span>အနိမ့်/အမြင့် (Y)</span> <span id="valY">130</span></div>
            <input type="range" id="sliderY" min="50" max="800" value="130">

            <div class="slider-label"><span>စာကြောင်းကြားအကွာအဝေး (Gap)</span> <span id="valGap">65</span></div>
            <input type="range" id="sliderGap" min="40" max="120" value="65">
        </div>
        <button onclick="downloadSingle()" class="btn-single">ပုံသိမ်းမည်</button>
    </div>

    <div class="section">
        <h3>၃။ Bulk (Zip) ထုတ်ရန်</h3>
        <input type="file" id="csvInput" accept="*/*">
        <button id="bulkBtn" class="btn-bulk">ZIP ထုတ်မည်</button>
        <div id="status"></div>
    </div>

    <img id="preview" src="" alt="Preview">
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');
    const statusDiv = document.getElementById('status');

    // Controls
    const sX = document.getElementById('sliderX');
    const sY = document.getElementById('sliderY');
    const sGap = document.getElementById('sliderGap');
    const vX = document.getElementById('valX');
    const vY = document.getElementById('valY');
    const vGap = document.getElementById('valGap');

    function drawSticker(data, template) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = template + "?t=" + new Date().getTime();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "black";
                ctx.font = "bold 52px sans-serif";
                ctx.lineWidth = 3;

                const x = parseInt(sX.value);
                const y = parseInt(sY.value);
                const g = parseInt(sGap.value);

                if (template === "1000158560.png") {
                    // Outdoor Custom Draw
                    ctx.fillText(data.unitId, x, y);
                    ctx.fillText(data.room, x, y + g);
                    ctx.fillText(data.brand, x, y + (g*2));
                    ctx.fillText(data.type, x, y + (g*3));
                    ctx.fillText(data.cooling, 410, y + (g*4) + 5);
                    ctx.fillText(data.refrigerant, 660, y + (g*4) + 5);
                } else {
                    // Indoor Custom Draw
                    ctx.fillText(data.unitId, x, y);
                    ctx.fillText(data.room, x, y + (g*1.6));
                    ctx.fillText(":", x - 80, y + (g*3.2));
                    ctx.fillText(data.brand, x, y + (g*3.2));
                    ctx.fillText(data.type, x, y + (g*4.8));
                    ctx.fillText(data.cooling + " HP", 720, y + (g*6.4));
                    ctx.fillText(data.refrigerant, 720, y + (g*8.1));
                }
                resolve();
            };
        });
    }

    async function update() {
        vX.innerText = sX.value;
        vY.innerText = sY.value;
        vGap.innerText = sGap.value;
        const data = {
            unitId: document.getElementById('unitId').value,
            room: document.getElementById('room').value,
            brand: document.getElementById('brand').value,
            type: document.getElementById('type').value,
            cooling: document.getElementById('cooling').value,
            refrigerant: document.getElementById('refrigerant').value
        };
        await drawSticker(data, document.getElementById('template').value);
        previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
    }

    function downloadSingle() {
        const link = document.createElement('a');
        link.download = "Sticker_Fix.jpg";
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }

    document.getElementById('bulkBtn').addEventListener('click', async () => {
        const file = document.getElementById('csvInput').files[0];
        if (!file) { alert("ကိုကို... ဖိုင်အရင်ရွေးပါ"); return; }
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
        const zip = new JSZip();
        for (let i = 1; i < lines.length; i++) {
            const c = lines[i].split(',');
            if (c.length < 5) continue;
            const data = { unitId: c[0], room: c[1], brand: c[2], type: c[3], cooling: c[4], refrigerant: c[5] };
            await drawSticker(data, document.getElementById('template').value);
            const b = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
            zip.file(data.unitId + ".jpg", b);
        }
        const content = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "Bulk_Stickers.zip";
        link.click();
    });

    document.querySelectorAll('input, select').forEach(el => el.oninput = update);
    window.onload = update;
</script>
</body>
</html>
