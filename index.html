<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Bulk - No Serial Column</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #1a1a1a; text-align: center; color: white; }
        .container { max-width: 500px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .form-group { text-align: left; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 2px; font-size: 13px; color: #4caf50; }
        input, select { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 6px; font-size: 15px; background: #3d3d3d; color: white; }
        .btn-green { background: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-blue { background: #1a73e8; margin-top: 10px; }
        #status { margin-top: 10px; font-size: 13px; color: #ffeb3b; }
        #preview { width: 100%; border-radius: 8px; border: 1px solid #444; margin-top: 15px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #4caf50;">CITY SCHOOL Bulk App</h2>
    
    <div class="form-group">
        <label>၁။ Excel (CSV) ဖိုင် ရွေးပါ</label>
        <input type="file" id="csvInput" accept=".csv">
    </div>

    <div class="form-group">
        <label>၂။ ပုံစံရွေးပါ</label>
        <select id="template">
            <option value="1000158560.png" selected>Outdoor Unit (Uses Column B)</option>
            <option value="1000158556.png">Indoor Unit (Uses Column A)</option>
        </select>
    </div>

    <button id="bulkBtn" class="btn-green btn-blue">ZIP ဖိုင် ထုတ်မည်</button>
    <div id="status"></div>

    <hr style="border: 0.5px solid #444; margin: 20px 0;">
    <p style="font-size: 12px; color: #888;">Preview</p>
    <img id="preview" src="" alt="Preview">
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');
    const templateSelect = document.getElementById('template');
    const bulkBtn = document.getElementById('bulkBtn');
    const statusDiv = document.getElementById('status');

    function drawSticker(data, selectedTemplate) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = selectedTemplate + "?t=" + new Date().getTime();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "black";
                ctx.font = "bold 56px sans-serif";

                if (selectedTemplate === "1000158560.png") {
                    // Outdoor Alignment (ကိုကို့ Precision Fix)
                    const xStart = 465; const xMid = 630;
                    ctx.fillText(data.unitId, xStart, 128);
                    ctx.fillText(data.room, xStart, 196);
                    ctx.fillText(data.brand, xStart, 269);
                    ctx.fillText(data.type, xStart, 347);
                    ctx.fillText(data.cooling, xMid + 50, 425);
                    ctx.fillText(data.refrigerant, xMid + 30, 493);
                } else {
                    // Indoor Alignment
                    const xLeft = 465; const xRight = 720;
                    ctx.fillText(data.unitId, xLeft, 125);
                    ctx.fillText(data.room, xLeft, 235);
                    ctx.fillText(data.brand, xLeft, 345);
                    ctx.fillText(data.type, xLeft, 455);
                    ctx.fillText(data.cooling + " HP", xRight, 575);
                    ctx.fillText(data.refrigerant, xRight, 690);
                }
                resolve();
            };
        });
    }

    bulkBtn.addEventListener('click', async () => {
        const file = document.getElementById('csvInput').files[0];
        if (!file) { alert("ကိုကို... CSV ဖိုင်အရင်ရွေးပေးပါရှင်"); return; }

        bulkBtn.disabled = true;
        const text = await file.text();
        const lines = text.split('\n');
        const zip = new JSZip();
        const selectedTemplate = templateSelect.value;

        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length < 4) continue;

            // Column A ကနေ စပြီး ဒေတာယူခြင်း
            const data = {
                unitId: (selectedTemplate === "1000158560.png") ? cols[1]?.trim() : cols[0]?.trim(), // Outdoor ဆို B, Indoor ဆို A
                room: cols[2]?.trim() || "",
                brand: cols[3]?.trim() || "",
                type: cols[4]?.trim() || "",
                cooling: cols[5]?.trim() || "",
                refrigerant: cols[6]?.trim() || ""
            };

            await drawSticker(data, selectedTemplate);
            const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
            zip.file(data.unitId.replace(/[/\\?%*:|"<>]/g, '-') + ".jpg", blob);
            statusDiv.innerText = `${i} / ${lines.length - 1} စုံ ပြီးပါပြီ...`;
        }

        const content = await zip.generateAsync({type: "blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = (selectedTemplate === "1000158560.png" ? "Outdoor_Stickers.zip" : "Indoor_Stickers.zip");
        link.click();
        
        statusDiv.innerText = "အောင်မြင်စွာ ထုတ်ပြီးပါပြီ ကိုကို!";
        bulkBtn.disabled = false;
    });

    window.onload = () => {
        drawSticker({unitId: "SAMPLE", room: "Room", brand: "Summit", type: "Wall", cooling: "2", refrigerant: "R-32a"}, templateSelect.value)
        .then(() => previewImg.src = canvas.toDataURL('image/jpeg', 0.8));
    };
</script>
</body>
</html>
