<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker Generator - Professional</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 15px; background: #f4f7f6; text-align: center; }
        .container { max-width: 550px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .form-group { text-align: left; margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 3px; font-size: 13px; color: #333; }
        input, select { width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { background: #1a73e8; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #preview-container { margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px; }
        #preview { width: 100%; border-radius: 5px; border: 1px solid #ddd; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0; color: #1a73e8;">AC Sticker App</h2>
    
    <div class="form-group">
        <label>Select Unit Type:</label>
        <select id="template">
            <option value="1000158560.png">Outdoor Unit (Template 1)</option>
            <option value="1000158556.png">Indoor Unit (Template 2)</option>
        </select>
    </div>

    <div class="form-group"><label>Unit ID:</label><input type="text" id="unitId" placeholder="ID"></div>
    <div class="form-group"><label>Room:</label><input type="text" id="room" placeholder="Room Name"></div>
    
    <div class="form-group">
        <label>Brand:</label>
        <select id="brand">
            <option value="Daikin">Daikin</option>
            <option value="Summit">Summit</option>
            <option value="Chigo">Chigo</option>
            <option value="Hisense">Hisense</option>
            <option value="Shimazu">Shimazu</option>
        </select>
    </div>

    <div class="form-group">
        <label>Type:</label>
        <select id="type">
            <option value="Wall-Mounted">Wall-Mounted</option>
            <option value="Ceiling Cassette">Ceiling Cassette</option>
        </select>
    </div>

    <div class="form-group">
        <label>Cooling Capacity (HP):</label>
        <select id="cooling">
            <option value="1.5">1.5</option>
            <option value="2.0">2.0</option>
            <option value="3.0">3.0</option>
        </select>
    </div>

    <div class="form-group">
        <label>Refrigerant Type:</label>
        <select id="refrigerant">
            <option value="R-22a">R-22a</option>
            <option value="R-32a">R-32a</option>
            <option value="R-410a">R-410a</option>
        </select>
    </div>

    <button onclick="downloadImage()">DOWNLOAD HD STICKER</button>
    
    <div id="preview-container">
        <p style="font-weight: bold; margin-bottom:5px;">Live Preview</p>
        <img id="preview" src="" alt="Sticker Preview">
    </div>
</div>

<canvas id="mainCanvas" width="1080" height="1420"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');
    const templateSelect = document.getElementById('template');

    function updateSticker() {
        const img = new Image();
        img.src = templateSelect.value;
        
        img.onload = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "black";
            ctx.font = "bold 44px Arial"; // ပိုကြီးပြီး Bold ဖြစ်အောင်

            const unitId = document.getElementById('unitId').value;
            const room = document.getElementById('room').value;
            const brand = document.getElementById('brand').value;
            const type = document.getElementById('type').value;
            const cooling = document.getElementById('cooling').value;
            const refrigerant = document.getElementById('refrigerant').value;

            if (templateSelect.value === "1000158560.png") {
                // Outdoor Unit - Template 1
                ctx.fillText(unitId, 420, 85);
                ctx.fillText(room, 420, 140);
                ctx.fillText(brand, 420, 195);
                ctx.fillText(type, 420, 250);
                ctx.fillText(cooling, 420, 305);
                ctx.fillText(refrigerant, 420, 415); // Pressure ကြားထဲမှာရှိလို့ နေရာချန်ထားပေးပါတယ်
            } else {
                // Indoor Unit - Template 2
                ctx.fillText(unitId, 420, 95);
                ctx.fillText(room, 420, 175);
                ctx.fillText(brand, 420, 255);
                ctx.fillText(type, 420, 335);
                ctx.fillText(cooling, 420, 415);
                ctx.fillText(refrigerant, 420, 495);
            }

            previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
        };
    }

    document.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('input', updateSticker);
    });

    function downloadImage() {
        const link = document.createElement('a');
        const name = document.getElementById('unitId').value || 'Sticker';
        link.download = name + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }

    window.onload = updateSticker;
</script>

</body>
</html>
