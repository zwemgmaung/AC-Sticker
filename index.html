<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker - Final No-Line Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #1a1a1a; color: white; text-align: center; }
        .container { max-width: 550px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .section { text-align: left; margin-bottom: 15px; padding: 15px; border: 1px solid #444; border-radius: 10px; background: #333; }
        h3 { color: #4caf50; font-size: 16px; margin: 0 0 10px 0; border-bottom: 1px solid #555; padding-bottom: 5px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #ccc; }
        
        input, select { 
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; 
            background: #ffffff; color: #333; box-sizing: border-box; margin-bottom: 12px; appearance: auto;
        }
        
        .room-ctrl { background: #444; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .slider-row { display: flex; align-items: center; gap: 10px; }
        input[type="range"] { flex: 1; }
        input[type="number"] { width: 75px; text-align: center; margin: 0; }

        button { color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-zip { background: #1a73e8; margin-bottom: 10px; }
        .btn-dl { background: #28a745; }
        #preview { width: 100%; border-radius: 8px; border: 2px solid #444; margin-top: 10px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #4caf50;">CITY SCHOOL Sticker Master</h2>

    <div class="section">
        <h3>၁။ Bulk (Zip) ထုတ်ရန်</h3>
        <input type="file" id="csvInput" accept="*/*">
        <button id="bulkBtn" class="btn-zip">CSV ဖြင့် ZIP ထုတ်မည်</button>
        <div id="status" style="font-size:12px; color:#ffeb3b; margin-top:5px;"></div>
    </div>

    <div class="section">
        <h3>၂။ တစ်ပုံချင်းစီ စစ်ဆေးရန် (Manual)</h3>
        <label>Unit Type:</label>
        <select id="template" onchange="update()">
            <option value="1000158560.png" selected>Outdoor Unit</option>
            <option value="1000158556.png">Indoor Unit</option>
        </select>
        
        <label>Unit ID:</label>
        <input type="text" id="unitId" value="CU-G-01">
        
        <div class="room-ctrl">
            <label style="color:#4caf50;">Room စာသား ဘယ်/ညာ ညှိရန် (X)</label>
            <div class="slider-row">
                <input type="range" id="roomX" min="350" max="750" value="415" oninput="syncX(this.value)">
                <input type="number" id="numX" value="415" oninput="syncX(this.value)">
            </div>
        </div>
        <input type="text" id="room" value="Reception and Waiting">

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <select id="brand"><option selected>SUMMIT</option><option>DAIKIN</option></select>
            <select id="type"><option selected>Wall-Mounted</option><option>Ceiling Cassette</option></select>
            <select id="cooling"><option>1.5</option><option selected>2</option><option>3</option></select>
            <select id="refrigerant"><option selected>R-32a</option><option>R-410a</option></select>
        </div>
        <button onclick="downloadSingle()" class="btn-dl">လက်ရှိပုံကို သိမ်းမည်</button>
    </div>

    <img id="preview" src="" alt="Preview">
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');

    function syncX(val) {
        document.getElementById('roomX').value = val;
        document.getElementById('numX').value = val;
        update();
    }

    function drawSticker(data, template) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = template + "?t=" + new Date().getTime();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "black";
                ctx.font = "bold 56px sans-serif";

                const rX = parseInt(document.getElementById('roomX').value);
                const fixedX = 415; // Indoor & Outdoor Brand Start

                if (template === "1000158560.png") {
                    // Outdoor Unit
                    ctx.fillText(data.unitId, 566, 106);
                    ctx.fillText(data.room, rX, 166);
                    ctx.fillText(data.brand, 566, 223); // Brand ကို Unit ID အမှတ်အတိုင်း (566) ထားရှိခြင်း
                    ctx.fillText(data.type, 518, 284);
                    ctx.fillText(data.cooling, 693, 343);
                    ctx.fillText(data.refrigerant, 627, 401);
                } else {
                    // Indoor Unit (No Lines)
                    ctx.fillText(data.unitId, fixedX, 130);
                    ctx.fillText(data.room, rX, 235);
                    // ကိုကို ပို့ပေးထားတဲ့ပုံမှာ : ပါပြီးသားမို့ : နေရာကို ကျော်ရေးထားပါတယ်
                    ctx.fillText(data.brand, fixedX, 345); 
                    ctx.fillText(data.type, fixedX, 455);
                    ctx.fillText(data.cooling + " HP", 720, 560);
                    ctx.fillText(data.refrigerant, 720, 675);
                }
                resolve();
            };
        });
    }

    async function update() {
        const data = {
            unitId: document.getElementById('unitId').value, room: document.getElementById('room').value,
            brand: document.getElementById('brand').value, type: document.getElementById('type').value,
            cooling: document.getElementById('cooling').value, refrigerant: document.getElementById('refrigerant').value
        };
        await drawSticker(data, document.getElementById('template').value);
        previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
    }

    function downloadSingle() {
        const link = document.createElement('a');
        link.download = document.getElementById('unitId').value + ".jpg";
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }

    document.getElementById('bulkBtn').addEventListener('click', async () => {
        const file = document.getElementById('csvInput').files[0];
        if (!file) return;
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
        const zip = new JSZip();
        for (let i = 1; i < lines.length; i++) {
            const c = lines[i].split(',');
            if (c.length < 5) continue;
            const data = { unitId: c[0], room: c[1], brand: c[2], type: c[3], cooling: c[4], refrigerant: c[5] };
            await drawSticker(data, document.getElementById('template').value);
            const b = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
            zip.file(data.unitId.replace(/[/\\?%*:|"<>]/g, '-') + ".jpg", b);
        }
        const content = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "Bulk_Stickers.zip";
        link.click();
    });

    document.querySelectorAll('input, select').forEach(el => el.oninput = update);
    window.onload = update;
</script>
</body>
</html>
