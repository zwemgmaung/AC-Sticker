<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker Generator - HD</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #eef2f3; text-align: center; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .form-group { text-align: left; margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: #fff; }
        button { background: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #preview-container { margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        #preview { width: 100%; border-radius: 8px; border: 1px solid #ddd; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #2c3e50;">AC Sticker App</h2>
    
    <div class="form-group">
        <label>Unit Type (Template):</label>
        <select id="template">
            <option value="1000158560.png">Outdoor Unit (Template 1)</option>
            <option value="1000158556.png">Indoor Unit (Template 2)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Unit ID:</label>
        <input type="text" id="unitId" placeholder="Enter Unit ID">
    </div>

    <div class="form-group">
        <label>Room:</label>
        <input type="text" id="room" placeholder="Enter Room Name">
    </div>

    <div class="form-group">
        <label>Brand:</label>
        <select id="brand">
            <option value="Daikin">Daikin</option>
            <option value="Summit">Summit</option>
            <option value="Chigo">Chigo</option>
            <option value="Hisense">Hisense</option>
            <option value="Shimazu">Shimazu</option>
        </select>
    </div>

    <div class="form-group">
        <label>Type:</label>
        <select id="type">
            <option value="Wall-Mounted">Wall-Mounted</option>
            <option value="Ceiling Cassette">Ceiling Cassette</option>
        </select>
    </div>

    <div class="form-group">
        <label>Cooling Capacity (HP):</label>
        <select id="cooling">
            <option value="1.5 HP">1.5 HP</option>
            <option value="2.0 HP">2.0 HP</option>
            <option value="3.0 HP">3.0 HP</option>
        </select>
    </div>

    <div class="form-group">
        <label>Refrigerant Type:</label>
        <select id="refrigerant">
            <option value="R-22a">R-22a</option>
            <option value="R-32a">R-32a</option>
            <option value="R-410a">R-410a</option>
        </select>
    </div>

    <button onclick="downloadImage()">Download Full HD JPEG</button>
    
    <div id="preview-container">
        <p style="font-weight: bold;">Live Preview</p>
        <img id="preview" src="" alt="Sticker Preview">
    </div>
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');

    function updateSticker() {
        const img = new Image();
        const selectedTemplate = document.getElementById('template').value;
        img.src = selectedTemplate;
        
        img.onload = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // Font Setting (Bold & Large)
            ctx.fillStyle = "black";
            ctx.font = "bold 42px Arial";

            let x = 450; 
            let y = 145; 
            let gap = 74; 

            // Indoor Unit (Template 2) အတွက် နေရာပြန်ညှိခြင်း
            if (selectedTemplate === "1000158556.png") {
                x = 445;
                y = 140;
                gap = 72;
            }

            // Data Mapping
            ctx.fillText(document.getElementById('unitId').value, x, y);
            ctx.fillText(document.getElementById('room').value, x, y + gap);
            ctx.fillText(document.getElementById('brand').value, x, y + (gap * 2));
            ctx.fillText(document.getElementById('type').value, x, y + (gap * 3));
            ctx.fillText(document.getElementById('cooling').value, x, y + (gap * 4));
            ctx.fillText(document.getElementById('refrigerant').value, x, y + (gap * 5));

            previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
        };
    }

    document.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('input', updateSticker);
    });

    function downloadImage() {
        const link = document.createElement('a');
        const name = document.getElementById('unitId').value || 'AC_Sticker';
        link.download = name + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }

    window.onload = updateSticker;
</script>

</body>
</html>
