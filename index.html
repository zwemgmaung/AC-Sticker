<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker - Custom Alignment Fix</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #1a1a1a; text-align: center; color: white; }
        .container { max-width: 500px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .form-group { text-align: left; margin-bottom: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 2px; font-size: 13px; color: #bbb; }
        input, select { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 6px; font-size: 15px; background: #3d3d3d; color: white; }
        button { background: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #preview { width: 100%; border-radius: 8px; border: 1px solid #444; margin-top: 15px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #4caf50; margin-bottom: 15px;">AC Sticker App</h2>
    
    <div class="form-group">
        <label>Select Unit Type:</label>
        <select id="template">
            <option value="1000158560.png" selected>Outdoor Unit</option>
            <option value="1000158556.png">Indoor Unit</option>
        </select>
    </div>

    <div class="form-group"><label>Unit ID:</label><input type="text" id="unitId" value="CU G-01"></div>
    <div class="form-group"><label>Room:</label><input type="text" id="room" value="M & E Control Room"></div>
    <div class="form-group"><label>Brand:</label><select id="brand"><option>Daikin</option><option selected>Summit</option><option>Chigo</option><option>Hisense</option><option>Shimazu</option></select></div>
    <div class="form-group"><label>Type:</label><select id="type"><option selected>Wall-Mounted</option><option>Ceiling Cassette</option></select></div>
    <div class="form-group"><label>Cooling Capacity (HP):</label><select id="cooling"><option>1.5</option><option selected>2</option><option>3</option></select></div>
    <div class="form-group"><label>Refrigerant Type:</label><select id="refrigerant"><option>R-22a</option><option selected>R-32a</option><option>R-410a</option></select></div>

    <button onclick="downloadImage()">DOWNLOAD HD STICKER</button>
    <img id="preview" src="" alt="Preview">
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');

    function update() {
        const img = new Image();
        const selected = document.getElementById('template').value;
        img.src = selected + "?t=" + new Date().getTime();
        img.onload = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "black";
            ctx.font = "bold 56px sans-serif";

            const unitId = document.getElementById('unitId').value;
            const room = document.getElementById('room').value;
            const brand = document.getElementById('brand').value;
            const type = document.getElementById('type').value;
            const cooling = document.getElementById('cooling').value;
            const refrigerant = document.getElementById('refrigerant').value;

            if (selected === "1000158560.png") {
                // Outdoor Unit - ကိုကို့ရဲ့ Custom Alignment
                const xStart = 465; 
                const xMid = 630;   

                // Y coordinates ပြင်ဆင်ချက်များ
                ctx.fillText(unitId, xStart, 128);   // Unit ID (50px ပြန်တင်ထားသည်)
                ctx.fillText(room, xStart, 196);     // Room (50px ပြန်တင်ထားသည်)
                ctx.fillText(brand, xStart, 269);    // Brand (40px ပြန်တင်ထားသည်)
                ctx.fillText(type, xStart, 347);     // Type (20px ပြန်တင်ထားသည်)
                ctx.fillText(cooling, xMid + 50, 425); // အရင်အတိုင်း (ကွက်တိဖြစ်နေသောနေရာ)
                ctx.fillText(refrigerant, xMid + 30, 493); // အရင်အတိုင်း (ကွက်တိဖြစ်နေသောနေရာ)
            } else {
                // Indoor Unit - လုံးဝမထိပါ
                const xLeft = 465;
                const xRight = 720;
                ctx.fillText(unitId, xLeft, 125);
                ctx.fillText(room, xLeft, 235);
                ctx.fillText(brand, xLeft, 345);
                ctx.fillText(type, xLeft, 455);
                ctx.fillText(cooling + " HP", xRight, 575);
                ctx.fillText(refrigerant, xRight, 690);
            }
            previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
        };
    }

    document.querySelectorAll('input, select').forEach(el => el.oninput = update);
    function downloadImage() {
        const link = document.createElement('a');
        link.download = (document.getElementById('unitId').value || 'Sticker') + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }
    window.onload = update;
</script>
</body>
</html>
