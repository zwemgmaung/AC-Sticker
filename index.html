<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker - Ultimate Fixed Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #1a1a1a; color: white; text-align: center; }
        .container { max-width: 550px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .section { text-align: left; margin-bottom: 15px; padding: 15px; border: 1px solid #444; border-radius: 10px; background: #333; }
        h3 { color: #4caf50; font-size: 16px; margin: 0 0 10px 0; border-bottom: 1px solid #555; padding-bottom: 5px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #ccc; }
        input, select { 
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; 
            background: #ffffff; color: #333; box-sizing: border-box; margin-bottom: 12px; appearance: auto;
        }
        button { color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-zip { background: #1a73e8; margin-bottom: 10px; }
        .btn-dl { background: #28a745; }
        #preview { width: 100%; border-radius: 8px; border: 1px solid #444; margin-top: 10px; background: white; }
        canvas { display: none; }
        #status { font-size: 13px; color: #ffeb3b; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #4caf50;">CITY SCHOOL Sticker Master</h2>

    <div class="section">
        <h3>၁။ Bulk (Zip) ထုတ်ရန်</h3>
        <input type="file" id="csvInput" accept="*/*">
        <button id="bulkBtn" class="btn-zip">ZIP ဖိုင်ထုတ်မည်</button>
        <div id="status"></div>
    </div>

    <div class="section">
        <h3>၂။ တစ်ပုံချင်းစီ (Manual)</h3>
        <label>Unit Type:</label>
        <select id="template" onchange="update()">
            <option value="1000158560.png">Outdoor Unit</option>
            <option value="1000158556.png" selected>Indoor Unit</option>
        </select>
        
        <label>Unit ID:</label><input type="text" id="unitId" value="CU G-01" oninput="update()">
        <label>Room Name:</label><input type="text" id="room" value="Reception and Waiting" oninput="update()">

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <select id="brand" onchange="update()">
                <option selected>Chigo</option><option>Hisense</option>
                <option>Daikin</option><option>Summit</option><option>Shimazu</option>
            </select>
            <select id="type" onchange="update()"><option selected>Wall-Mounted</option><option>Ceiling Cassette</option></select>
            <select id="cooling" onchange="update()"><option>1.5</option><option selected>2</option><option>3</option></select>
            <select id="refrigerant" onchange="update()"><option selected>R-32a</option><option>R-410a</option></select>
        </div>
        <button onclick="downloadSingle()" class="btn-dl">သိမ်းမည် (ကိုက်တိ)</button>
    </div>

    <img id="preview" src="" alt="Preview">
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>
<canvas id="croppedCanvas" width="952" height="1118"></canvas>

<script>
    const mainCanvas = document.getElementById('mainCanvas');
    const mainCtx = mainCanvas.getContext('2d');
    const croppedCanvas = document.getElementById('croppedCanvas');
    const croppedCtx = croppedCanvas.getContext('2d');
    const previewImg = document.getElementById('preview');
    const templateSelect = document.getElementById('template');

    function drawSticker(data, template) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = template + "?t=" + new Date().getTime();
            img.onload = function() {
                mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
                mainCtx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
                
                mainCtx.fillStyle = "black";
                mainCtx.font = "bold 56px sans-serif";
                mainCtx.textAlign = "center";
                
                // ကိုကိုအရင်က မှာထားတဲ့ Fixed အမှတ်များ (Full Size 1080x1350 ပေါ်မှာ အခြေခံထားပါသည်)
                const centerX = 680; 

                if (template.includes("158560")) {
                    // Outdoor Unit Fixed Coords
                    mainCtx.fillText(data.unitId, centerX, 106);
                    mainCtx.fillText(data.room, centerX, 166);
                    mainCtx.fillText(data.brand, centerX, 223);
                    mainCtx.fillText(data.type, centerX, 284);
                    mainCtx.fillText(data.cooling, centerX, 343);
                    mainCtx.fillText(data.refrigerant, centerX, 401);
                } else {
                    // Indoor Unit Fixed Coords
                    mainCtx.fillText(data.unitId, centerX, 240);
                    mainCtx.fillText(data.room, centerX, 344);
                    mainCtx.fillText(data.brand, centerX, 444);
                    mainCtx.fillText(data.type, centerX, 540);
                    mainCtx.fillText(data.cooling, centerX, 647);
                    mainCtx.fillText(data.refrigerant, centerX, 750);
                }
                resolve();
            };
        });
    }

    async function update() {
        const data = {
            unitId: document.getElementById('unitId').value, 
            room: document.getElementById('room').value,
            brand: document.getElementById('brand').value, 
            type: document.getElementById('type').value,
            cooling: document.getElementById('cooling').value, 
            refrigerant: document.getElementById('refrigerant').value
        };
        await drawSticker(data, templateSelect.value);
        // Preview မှာ ပုံအပြည့် ပြပေးပါတယ်
        previewImg.src = mainCanvas.toDataURL('image/jpeg', 0.8);
    }

    function downloadSingle() {
        // သိမ်းတဲ့အခါမှသာ Crop လုပ်ပါသည်
        croppedCtx.drawImage(mainCanvas, 64, 116, 952, 1118, 0, 0, 952, 1118);
        
        const unitId = document.getElementById('unitId').value;
        const typeLabel = templateSelect.value.includes("158556") ? "Indoor" : "Outdoor";
        const link = document.createElement('a');
        link.download = `${unitId} (${typeLabel}).jpg`;
        link.href = croppedCanvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }

    document.getElementById('bulkBtn').addEventListener('click', async () => {
        const file = document.getElementById('csvInput').files[0];
        const status = document.getElementById('status');
        if (!file) return;
        
        status.innerText = "ထုတ်နေပါပြီ...";
        document.getElementById('bulkBtn').disabled = true;
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
        const zip = new JSZip();
        const template = templateSelect.value;
        const typeLabel = template.includes("158556") ? "Indoor" : "Outdoor";

        for (let i = 1; i < lines.length; i++) {
            const c = lines[i].split(',');
            if (c.length < 5) continue;
            const data = { unitId: c[0], room: c[1], brand: c[2], type: c[3], cooling: c[4], refrigerant: c[5] };
            await drawSticker(data, template);
            
            // Bulk ZIP အတွက်လည်း Crop လုပ်ပါသည်
            croppedCtx.drawImage(mainCanvas, 64, 116, 952, 1118, 0, 0, 952, 1118);
            const b = await new Promise(r => croppedCanvas.toBlob(r, 'image/jpeg', 0.95));
            zip.file(`${data.unitId} (${typeLabel}).jpg`, b);
            status.innerText = `${i} / ${lines.length - 1} ပြီးပါပြီ ကိုကို`;
        }
        
        const content = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `${typeLabel}_Unit_Stickers.zip`;
        link.click();
        status.innerText = "အားလုံးပြီးပါပြီရှင်!";
        document.getElementById('bulkBtn').disabled = false;
    });

    window.onload = update;
</script>
</body>
</html>
