<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker - New Template Alignment Fix</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f7f6; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { text-align: left; margin-bottom: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 2px; font-size: 13px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { background: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #preview { width: 100%; border-radius: 8px; border: 1px solid #ddd; margin-top: 15px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #1a73e8; margin-bottom: 15px;">AC Sticker App (New Template)</h2>
    
    <div class="form-group">
        <label>Select Unit Type:</label>
        <select id="template">
            <option value="1000159597.png" selected>New Template (Uses 1000159597.png)</option>
        </select>
    </div>

    <div class="form-group"><label>Unit ID:</label><input type="text" id="unitId" value="CU G-01"></div>
    <div class="form-group"><label>Room:</label><input type="text" id="room" value="M & E Control Room"></div>
    <div class="form-group"><label>Brand:</label><input type="text" id="brand" value="Summit"></div>
    <div class="form-group"><label>Type:</label><input type="text" id="type" value="Wall-Mounted"></div>
    <div class="form-group"><label>Cooling Capacity (HP):</label><input type="text" id="cooling" value="2"></div>
    <div class="form-group"><label>Refrigerant Type:</label><input type="text" id="refrigerant" value="R-32a"></div>
    
    <div class="form-group"><label>Running Pressure (psi):</label><input type="text" id="pressure" value="120"></div>
    <div class="form-group"><label>Running Ampere (A):</label><input type="text" id="ampere" value="8.5"></div>
    <div class="form-group"><label>Running Watt (W):</label><input type="text" id="watt" value="1800"></div>

    <button onclick="downloadImage()">DOWNLOAD HD STICKER</button>
    <img id="preview" src="" alt="Preview">
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');

    function update() {
        const img = new Image();
        const selected = document.getElementById('template').value;
        img.src = selected + "?t=" + new Date().getTime();
        img.onload = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "black";
            ctx.font = "bold 52px sans-serif"; // Font size slightly reduced for new layout

            // Data values
            const unitId = document.getElementById('unitId').value;
            const room = document.getElementById('room').value;
            const brand = document.getElementById('brand').value;
            const type = document.getElementById('type').value;
            const cooling = document.getElementById('cooling').value;
            const refrigerant = document.getElementById('refrigerant').value;
            const pressure = document.getElementById('pressure').value;
            const ampere = document.getElementById('ampere').value;
            const watt = document.getElementById('watt').value;

            // NEW ALIGNMENT LOGIC (for template 1000159597.png)
            if (unitId.startsWith('CU')) {
                // Outdoor Unit - New Coordinates
                const xLeft = 475; // Y coordinates calculated for CU layout
                const xPressure = 475; const xAmpere = 475; const xWatt = 475;

                ctx.fillText(unitId, xLeft, 130);   // Unit ID line
                ctx.fillText(room, xLeft, 195);     // Room line
                ctx.fillText(brand, xLeft, 260);    // Brand line
                ctx.fillText(type, xLeft, 325);     // Type line
                
                // HP and Gas on same line
                ctx.fillText(cooling, xLeft, 390);  
                ctx.fillText(refrigerant, 720, 390);

                // Running Data on distinct lines
                ctx.fillText(pressure, xPressure, 455);
                ctx.fillText(ampere, xAmpere, 520);
                ctx.fillText(watt, xWatt, 585);
            } else {
                // Indoor Unit - New Coordinates (Different layout)
                const xLeft = 475; // Y coordinates calculated for FCU layout
                const xPressure = 475; const xAmpere = 475; const xWatt = 475;

                ctx.fillText(unitId, xLeft, 130);   // Unit ID line
                ctx.fillText(room, xLeft, 195);     // Room line
                ctx.fillText(brand, xLeft, 260);    // Brand line
                ctx.fillText(type, xLeft, 325);     // Type line
                
                // HP and Gas on different lines
                ctx.fillText(cooling, xLeft, 390);
                ctx.fillText(refrigerant, xLeft, 455);

                // Running Data on higher positions
                ctx.fillText(pressure, xPressure, 520);
                ctx.fillText(ampere, xAmpere, 585);
                ctx.fillText(watt, xWatt, 650);
            }
            previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
        };
    }

    document.querySelectorAll('input, select').forEach(el => el.oninput = update);
    function downloadImage() {
        const link = document.createElement('a');
        link.download = (document.getElementById('unitId').value || 'Sticker') + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }
    window.onload = update;
</script>
</body>
</html>
