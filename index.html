<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker - Fixed Coordinates App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #1a1a1a; color: white; text-align: center; }
        .container { max-width: 550px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .section { text-align: left; margin-bottom: 15px; padding: 15px; border: 1px solid #444; border-radius: 10px; background: #333; }
        h3 { color: #4caf50; font-size: 16px; margin: 0 0 10px 0; border-bottom: 1px solid #555; padding-bottom: 5px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #ccc; }
        
        /* Drop-down arrow ပြန်ပေါ်ရန်နှင့် အဖြူရောင်ဖြစ်ရန် */
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 15px; 
            background: #ffffff; 
            color: #333; 
            box-sizing: border-box; 
            margin-bottom: 12px;
            appearance: auto; /* Arrow ပြန်ဖော်ပေးခြင်း */
        }
        
        button { color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-zip { background: #1a73e8; margin-bottom: 10px; }
        .btn-dl { background: #28a745; }
        #status { margin-top: 10px; font-size: 13px; color: #ffeb3b; }
        #preview { width: 100%; border-radius: 8px; border: 2px solid #444; margin-top: 10px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #4caf50;">CITY SCHOOL Sticker Master</h2>

    <div class="section">
        <h3>၁။ Bulk (Zip) ထုတ်ရန်</h3>
        <input type="file" id="csvInput" accept="*/*">
        <button id="bulkBtn" class="btn-zip">CSV ဖြင့် ZIP ထုတ်မည်</button>
        <div id="status"></div>
    </div>

    <div class="section">
        <h3>၂။ တစ်ပုံချင်းစီ စစ်ဆေးရန် (Manual)</h3>
        <label>Unit Type:</label>
        <select id="template">
            <option value="1000158560.png" selected>Outdoor Unit</option>
            <option value="1000158556.png">Indoor Unit</option>
        </select>
        
        <label>Unit ID:</label><input type="text" id="unitId" value="CU-G-01">
        <label>Room:</label><input type="text" id="room" value="M&E Control Room">
        
        <label>Brand:</label>
        <select id="brand">
            <option selected>SUMMIT</option><option>DAIKIN</option><option>CHIGO</option><option>HISENSE</option><option>SHIMAZU</option>
        </select>

        <label>Type:</label>
        <select id="type">
            <option selected>Wall-Mounted</option><option>Ceiling Cassette</option><option>Floor Standing</option>
        </select>

        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label>HP:</label>
                <select id="cooling"><option>1</option><option>1.5</option><option selected>2</option><option>3</option><option>5</option></select>
            </div>
            <div style="flex:1;">
                <label>Gas:</label>
                <select id="refrigerant"><option selected>R-32a</option><option>R-410a</option><option>R-22a</option></select>
            </div>
        </div>

        <button onclick="downloadSingle()" class="btn-dl">လက်ရှိပုံကို သိမ်းမည်</button>
    </div>

    <img id="preview" src="" alt="Preview">
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');
    const templateSelect = document.getElementById('template');

    function drawSticker(data, template) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = template + "?t=" + new Date().getTime();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "black";
                ctx.font = "bold 52px sans-serif";

                if (template === "1000158560.png") {
                    // ကိုကိုပေးထားတဲ့ Outdoor Fixed အမှတ်များ
                    ctx.fillText(data.unitId, 566, 106);      // Unit ID
                    ctx.fillText(data.room, 526, 166);         // Room
                    ctx.fillText(data.brand, 565, 223);        // Brand
                    ctx.fillText(data.type, 518, 284);         // Type
                    ctx.fillText(data.cooling, 693, 343);      // HP
                    ctx.fillText(data.refrigerant, 627, 401);  // Gas
                } else {
                    // Indoor Alignment (မူရင်းအတိုင်း)
                    ctx.fillText(data.unitId, 480, 130);
                    ctx.fillText(data.room, 480, 235);
                    ctx.fillText(":", 400, 345);
                    ctx.fillText(data.brand, 480, 345);
                    ctx.fillText(data.type, 480, 455);
                    ctx.fillText(data.cooling + " HP", 720, 560);
                    ctx.fillText(data.refrigerant, 720, 675);
                }
                resolve();
            };
        });
    }

    async function update() {
        const data = {
            unitId: document.getElementById('unitId').value,
            room: document.getElementById('room').value,
            brand: document.getElementById('brand').value,
            type: document.getElementById('type').value,
            cooling: document.getElementById('cooling').value,
            refrigerant: document.getElementById('refrigerant').value
        };
        await drawSticker(data, templateSelect.value);
        previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
    }

    function downloadSingle() {
        const link = document.createElement('a');
        link.download = document.getElementById('unitId').value + ".jpg";
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }

    document.getElementById('bulkBtn').addEventListener('click', async () => {
        const file = document.getElementById('csvInput').files[0];
        if (!file) { alert("ကိုကို... CSV ဖိုင်အရင်ရွေးပါရှင်"); return; }
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
        const zip = new JSZip();
        const template = templateSelect.value;
        const status = document.getElementById('status');

        for (let i = 1; i < lines.length; i++) {
            const c = lines[i].split(',');
            if (c.length < 5) continue;
            const data = { unitId: c[0], room: c[1], brand: c[2], type: c[3], cooling: c[4], refrigerant: c[5] };
            await drawSticker(data, template);
            const b = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
            zip.file(data.unitId.replace(/[/\\?%*:|"<>]/g, '-') + ".jpg", b);
            status.innerText = `${i} / ${lines.length - 1} ပြီးပါပြီ...`;
        }
        const content = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = (template.includes("1000158560") ? "Outdoor_Stickers.zip" : "Indoor_Stickers.zip");
        link.click();
        status.innerText = "အားလုံးပြီးပါပြီ ကိုကို!";
    });

    document.querySelectorAll('input, select').forEach(el => el.oninput = update);
    window.onload = update;
</script>
</body>
</html>
