<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker - Ultimate Alignment Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #1a1a1a; color: white; text-align: center; }
        .container { max-width: 900px; margin: auto; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .controls { flex: 1.2; min-width: 350px; background: #2d2d2d; padding: 15px; border-radius: 12px; text-align: left; height: 95vh; overflow-y: auto; }
        .preview-side { flex: 0.8; min-width: 300px; position: sticky; top: 10px; }
        .section { background: #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #444; }
        h3 { color: #4caf50; font-size: 14px; margin: 0 0 10px 0; border-bottom: 1px solid #555; }
        label { display: block; font-size: 11px; color: #aaa; margin-bottom: 3px; }
        input[type="text"], select { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 4px; border: none; font-size: 13px; }
        .slider-group { background: #444; padding: 8px; border-radius: 6px; margin-bottom: 8px; }
        .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .slider-row span { font-size: 10px; width: 45px; color: #4caf50; font-weight: bold; }
        input[type="range"] { flex: 1; }
        input[type="number"] { width: 60px; text-align: center; border-radius: 4px; border: none; font-size: 12px; padding: 3px; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-dl { background: #28a745; color: white; }
        .btn-zip { background: #1a73e8; color: white; margin-top: 10px; }
        #preview { width: 100%; border-radius: 8px; border: 2px solid #444; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <div class="section">
            <h3>၁။ ဒေတာထည့်ရန်</h3>
            <select id="template" onchange="update()">
                <option value="1000158560.png">Outdoor Unit</option>
                <option value="1000158556.png" selected>Indoor Unit</option>
            </select>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                <input type="text" id="unitId" value="CU-G-01">
                <input type="text" id="room" value="M&E Room">
                <input type="text" id="brand" value="SUMMIT">
                <input type="text" id="type" value="Wall">
                <input type="text" id="cooling" value="2">
                <input type="text" id="refrigerant" value="R-32a">
            </div>
        </div>

        <h3>၂။ တစ်ကြောင်းချင်းစီ နေရာချိန်ရန် (X & Y)</h3>
        <script>
            const fields = ["Unit ID", "Room", "Brand", "Type", "Capacity", "Gas"];
            // Indoor အတွက် အနီးစပ်ဆုံး Default Coordinates များ
            const defX = [415, 415, 415, 415, 650, 650];
            const defY = [140, 215, 290, 365, 435, 510];

            fields.forEach((name, i) => {
                document.write(`
                <div class="slider-group">
                    <label>${name}</label>
                    <div class="slider-row">
                        <span>X: <b id="vx${i+1}">${defX[i]}</b></span>
                        <input type="range" id="x${i+1}" min="0" max="1000" value="${defX[i]}" oninput="sync(${i+1}, 'x', this.value)">
                        <input type="number" id="nx${i+1}" value="${defX[i]}" oninput="sync(${i+1}, 'x', this.value)">
                    </div>
                    <div class="slider-row">
                        <span>Y: <b id="vy${i+1}">${defY[i]}</b></span>
                        <input type="range" id="y${i+1}" min="0" max="1000" value="${defY[i]}" oninput="sync(${i+1}, 'y', this.value)">
                        <input type="number" id="ny${i+1}" value="${defY[i]}" oninput="sync(${i+1}, 'y', this.value)">
                    </div>
                </div>`);
            });
        </script>
    </div>

    <div class="preview-side">
        <img id="preview" src="" alt="Preview">
        <button onclick="downloadSingle()" class="btn-dl">လက်ရှိပုံကို သိမ်းမည်</button>
        <div class="section" style="margin-top:15px; text-align:left;">
            <h3>၃။ Bulk (Zip) ထုတ်ရန်</h3>
            <input type="file" id="csvInput" accept="*/*">
            <button id="bulkBtn" class="btn-zip">ZIP ဖိုင်ထုတ်မည်</button>
            <div id="status" style="font-size:12px; margin-top:5px; color:#ffeb3b;"></div>
        </div>
    </div>
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');

    function sync(i, axis, val) {
        document.getElementById(axis + i).value = val;
        document.getElementById('n' + axis + i).value = val;
        document.getElementById('v' + axis + i).innerText = val;
        update();
    }

    function drawSticker(data, template) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = template + "?t=" + new Date().getTime();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "black";
                ctx.font = "bold 52px sans-serif";

                const getX = (i) => document.getElementById('x' + i).value;
                const getY = (i) => document.getElementById('y' + i).value;

                ctx.fillText(data.unitId, getX(1), getY(1));
                ctx.fillText(data.room, getX(2), getY(2));
                ctx.fillText(data.brand, getX(3), getY(3));
                ctx.fillText(data.type, getX(4), getY(4));
                
                let hpTxt = (template.includes("158556")) ? data.cooling + " HP" : data.cooling;
                ctx.fillText(hpTxt, getX(5), getY(5));
                ctx.fillText(data.refrigerant, getX(6), getY(6));
                
                resolve();
            };
        });
    }

    async function update() {
        const data = {
            unitId: document.getElementById('unitId').value, room: document.getElementById('room').value,
            brand: document.getElementById('brand').value, type: document.getElementById('type').value,
            cooling: document.getElementById('cooling').value, refrigerant: document.getElementById('refrigerant').value
        };
        await drawSticker(data, document.getElementById('template').value);
        previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
    }

    function downloadSingle() {
        const link = document.createElement('a');
        link.download = document.getElementById('unitId').value + ".jpg";
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }

    document.getElementById('bulkBtn').addEventListener('click', async () => {
        const file = document.getElementById('csvInput').files[0];
        if (!file) return;
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
        const zip = new JSZip();
        for (let i = 1; i < lines.length; i++) {
            const c = lines[i].split(',');
            if (c.length < 5) continue;
            const data = { unitId: c[0], room: c[1], brand: c[2], type: c[3], cooling: c[4], refrigerant: c[5] };
            await drawSticker(data, document.getElementById('template').value);
            const b = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
            zip.file(data.unitId + ".jpg", b);
        }
        const content = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "Bulk_Stickers.zip";
        link.click();
    });

    document.querySelectorAll('input, select').forEach(el => el.oninput = update);
    window.onload = update;
</script>
</body>
</html>
