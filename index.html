<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker Final Fix</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f7f6; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { text-align: left; margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 3px; font-size: 13px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { background: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #preview { width: 100%; border-radius: 8px; border: 1px solid #ddd; margin-top: 15px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #1a73e8; margin-bottom: 20px;">AC Sticker App</h2>
    
    <div class="form-group">
        <label>Select Unit Type:</label>
        <select id="template">
            <option value="1000158560.png">Outdoor Unit</option>
            <option value="1000158556.png" selected>Indoor Unit</option>
        </select>
    </div>

    <div class="form-group"><label>Unit ID:</label><input type="text" id="unitId" value="FCU G-01"></div>
    <div class="form-group"><label>Room:</label><input type="text" id="room" value="M & E Control Room"></div>
    
    <div class="form-group">
        <label>Brand:</label>
        <select id="brand">
            <option value="Daikin">Daikin</option>
            <option value="Summit" selected>Summit</option>
            <option value="Chigo">Chigo</option>
            <option value="Hisense">Hisense</option>
            <option value="Shimazu">Shimazu</option>
        </select>
    </div>

    <div class="form-group">
        <label>Type:</label>
        <select id="type">
            <option value="Wall-Mounted" selected>Wall-Mounted</option>
            <option value="Ceiling Cassette">Ceiling Cassette</option>
        </select>
    </div>

    <div class="form-group">
        <label>Cooling Capacity (HP):</label>
        <select id="cooling">
            <option value="1.5">1.5</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>
    </div>

    <div class="form-group">
        <label>Refrigerant Type:</label>
        <select id="refrigerant">
            <option value="R-22a">R-22a</option>
            <option value="R-32a" selected>R-32a</option>
            <option value="R-410a">R-410a</option>
        </select>
    </div>

    <button onclick="downloadImage()">DOWNLOAD HD STICKER</button>
    <img id="preview" src="" alt="Preview">
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');

    function update() {
        const img = new Image();
        const selected = document.getElementById('template').value;
        img.src = selected;
        img.onload = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "black";
            ctx.font = "bold 60px sans-serif"; // ကိုကို့ပုံစံအတိုင်း Font ပိုကြီးပေးထားပါတယ်

            const unitId = document.getElementById('unitId').value;
            const room = document.getElementById('room').value;
            const brand = document.getElementById('brand').value;
            const type = document.getElementById('type').value;
            const cooling = document.getElementById('cooling').value + " HP";
            const refrigerant = document.getElementById('refrigerant').value;

            if (selected === "1000158560.png") {
                // Outdoor Unit Coordinates
                const x = 450;
                ctx.fillText(unitId, x, 105);
                ctx.fillText(room, x, 175);
                ctx.fillText(brand, x, 245);
                ctx.fillText(type, x, 315);
                ctx.fillText(cooling, x, 385);
                ctx.fillText(refrigerant, x, 525);
            } else {
                // Indoor Unit Coordinates (ဒုတိယပုံအတိုင်း အတိအကျချိန်ညှိချက်)
                const xLeft = 450; // ပထမ ၄ ကြောင်းအတွက်
                const xRight = 700; // Cooling နဲ့ Refrigerant အတွက် ညာဘက်ကို ကပ်ထုတ်ခြင်း

                ctx.fillText(unitId, xLeft, 115);
                ctx.fillText(room, xLeft, 225);
                ctx.fillText(brand, xLeft, 335);
                ctx.fillText(type, xLeft, 445);
                
                // ဒုတိယပုံထဲကအတိုင်း ညာဘက်ကို ပိုပို့ထားပါတယ်
                ctx.fillText(cooling, xRight, 560);
                ctx.fillText(refrigerant, xRight, 675);
            }
            previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
        };
    }

    document.querySelectorAll('input, select').forEach(el => el.oninput = update);
    function downloadImage() {
        const link = document.createElement('a');
        link.download = (document.getElementById('unitId').value || 'Sticker') + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }
    window.onload = update;
</script>
</body>
</html>
