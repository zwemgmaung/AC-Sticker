<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker - Individual Line Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #1a1a1a; color: white; text-align: center; }
        .container { max-width: 800px; margin: auto; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .controls { flex: 1; min-width: 300px; background: #2d2d2d; padding: 15px; border-radius: 12px; text-align: left; }
        .preview-side { flex: 1; min-width: 300px; }
        .section { background: #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #444; }
        h3 { color: #4caf50; font-size: 14px; margin: 0 0 10px 0; border-bottom: 1px solid #555; }
        label { display: block; font-size: 11px; color: #aaa; }
        input[type="text"], select { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 4px; border: none; font-size: 13px; }
        .slider-box { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .slider-box span { font-size: 10px; width: 50px; color: #4caf50; }
        input[type="range"] { flex: 1; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-dl { background: #28a745; color: white; }
        .btn-zip { background: #1a73e8; color: white; margin-top: 10px; }
        #preview { width: 100%; border-radius: 8px; border: 2px solid #444; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <h3>၁။ ဒေတာနှင့် ပုံစံရွေးရန်</h3>
        <select id="template" onchange="update()">
            <option value="1000158560.png">Outdoor Unit</option>
            <option value="1000158556.png">Indoor Unit</option>
        </select>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <input type="text" id="unitId" value="CU-G-01" placeholder="Unit ID">
            <input type="text" id="room" value="Control Room" placeholder="Room">
            <input type="text" id="brand" value="SUMMIT" placeholder="Brand">
            <input type="text" id="type" value="Wall" placeholder="Type">
            <input type="text" id="cooling" value="2" placeholder="HP">
            <input type="text" id="refrigerant" value="R-32a" placeholder="Gas">
        </div>

        <h3>၂။ တစ်ကြောင်းချင်းစီ နေရာချိန်ရန် (X & Y)</h3>
        <div class="section">
            <label>Line 1 (Unit ID)</label>
            <div class="slider-box"><span>X: <b id="vx1">480</b></span><input type="range" id="x1" min="300" max="700" value="480"></div>
            <div class="slider-box"><span>Y: <b id="vy1">130</b></span><input type="range" id="y1" min="50" max="800" value="130"></div>
        </div>
        <div class="section">
            <label>Line 2 (Room)</label>
            <div class="slider-box"><span>X: <b id="vx2">480</b></span><input type="range" id="x2" min="300" max="700" value="480"></div>
            <div class="slider-box"><span>Y: <b id="vy2">195</b></span><input type="range" id="y2" min="50" max="800" value="195"></div>
        </div>
        <div class="section">
            <label>Line 3 (Brand)</label>
            <div class="slider-box"><span>X: <b id="vx3">480</b></span><input type="range" id="x3" min="300" max="700" value="480"></div>
            <div class="slider-box"><span>Y: <b id="vy3">260</b></span><input type="range" id="y3" min="50" max="800" value="260"></div>
        </div>
        <div class="section">
            <label>Line 4 (Type)</label>
            <div class="slider-box"><span>X: <b id="vx4">480</b></span><input type="range" id="x4" min="300" max="700" value="480"></div>
            <div class="slider-box"><span>Y: <b id="vy4">325</b></span><input type="range" id="y4" min="50" max="800" value="325"></div>
        </div>
        <div class="section">
            <label>Line 5 (HP)</label>
            <div class="slider-box"><span>X: <b id="vx5">410</b></span><input type="range" id="x5" min="300" max="800" value="410"></div>
            <div class="slider-box"><span>Y: <b id="vy5">395</b></span><input type="range" id="y5" min="50" max="800" value="395"></div>
        </div>
        <div class="section">
            <label>Line 6 (Gas)</label>
            <div class="slider-box"><span>X: <b id="vx6">660</b></span><input type="range" id="x6" min="300" max="900" value="660"></div>
            <div class="slider-box"><span>Y: <b id="vy6">395</b></span><input type="range" id="y6" min="50" max="800" value="395"></div>
        </div>
    </div>

    <div class="preview-side">
        <img id="preview" src="" alt="Preview">
        <button onclick="downloadSingle()" class="btn-dl">လက်ရှိပုံကို သိမ်းမည်</button>
        <div class="section" style="margin-top:15px; text-align:left;">
            <h3>၃။ Bulk (Zip) ထုတ်ရန်</h3>
            <input type="file" id="csvInput" accept="*/*" style="background:#444; color:white;">
            <button id="bulkBtn" class="btn-zip">ZIP ဖိုင်ထုတ်မည်</button>
            <div id="status" style="font-size:12px; margin-top:5px; color:#ffeb3b;"></div>
        </div>
    </div>
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');

    function drawSticker(data, template) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = template + "?t=" + new Date().getTime();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "black";
                ctx.font = "bold 52px sans-serif";

                // တစ်ကြောင်းချင်းစီအတွက် Slider တန်ဖိုးများကို ယူခြင်း
                ctx.fillText(data.unitId, document.getElementById('x1').value, document.getElementById('y1').value);
                ctx.fillText(data.room, document.getElementById('x2').value, document.getElementById('y2').value);
                
                // Indoor ဖြစ်ရင် Brand ရှေ့မှာ Colon ထည့်ရန်
                if(template === "1000158556.png") {
                    ctx.fillText(":", parseInt(document.getElementById('x3').value) - 80, document.getElementById('y3').value);
                }
                
                ctx.fillText(data.brand, document.getElementById('x3').value, document.getElementById('y3').value);
                ctx.fillText(data.type, document.getElementById('x4').value, document.getElementById('y4').value);
                
                // HP နဲ့ Gas (Indoor ဆိုရင် စာသားအပြည့် Outdoor ဆိုရင် တန်ဖိုးပဲ)
                let hpTxt = (template === "1000158556.png") ? data.cooling + " HP" : data.cooling;
                ctx.fillText(hpTxt, document.getElementById('x5').value, document.getElementById('y5').value);
                ctx.fillText(data.refrigerant, document.getElementById('x6').value, document.getElementById('y6').value);
                
                resolve();
            };
        });
    }

    async function update() {
        // Slider တန်ဖိုးများကို စာသားဖြင့် ပြသရန်
        for(let i=1; i<=6; i++) {
            document.getElementById('vx'+i).innerText = document.getElementById('x'+i).value;
            document.getElementById('vy'+i).innerText = document.getElementById('y'+i).value;
        }

        const data = {
            unitId: document.getElementById('unitId').value,
            room: document.getElementById('room').value,
            brand: document.getElementById('brand').value,
            type: document.getElementById('type').value,
            cooling: document.getElementById('cooling').value,
            refrigerant: document.getElementById('refrigerant').value
        };
        await drawSticker(data, document.getElementById('template').value);
        previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
    }

    function downloadSingle() {
        const link = document.createElement('a');
        link.download = document.getElementById('unitId').value + ".jpg";
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }

    document.getElementById('bulkBtn').addEventListener('click', async () => {
        const file = document.getElementById('csvInput').files[0];
        if (!file) { alert("ကိုကို... CSV ဖိုင်အရင်ရွေးပါ"); return; }
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
        const zip = new JSZip();
        const template = document.getElementById('template').value;
        
        for (let i = 1; i < lines.length; i++) {
            const c = lines[i].split(',');
            if (c.length < 5) continue;
            const data = { unitId: c[0], room: c[1], brand: c[2], type: c[3], cooling: c[4], refrigerant: c[5] };
            await drawSticker(data, template);
            const b = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
            zip.file(data.unitId + ".jpg", b);
            document.getElementById('status').innerText = `${i} / ${lines.length -1} ပြီးပါပြီ...`;
        }
        const content = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "Bulk_Stickers.zip";
        link.click();
        document.getElementById('status').innerText = "အားလုံးပြီးပါပြီ ကိုကို!";
    });

    document.querySelectorAll('input, select').forEach(el => el.oninput = update);
    window.onload = update;
</script>
</body>
</html>
