<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker - Precision Alignment</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #1a1a1a; text-align: center; color: white; }
        .container { max-width: 550px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .section { text-align: left; margin-bottom: 20px; padding: 15px; border: 1px solid #444; border-radius: 10px; background: #333; }
        h3 { color: #4caf50; margin-top: 0; border-bottom: 1px solid #555; padding-bottom: 5px; font-size: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 13px; color: #ccc; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; background: #ffffff; color: #333; box-sizing: border-box; margin-bottom: 12px; }
        button { color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-bulk { background: #1a73e8; margin-bottom: 10px; }
        .btn-single { background: #28a745; }
        #status { margin-top: 10px; font-size: 13px; color: #ffeb3b; text-align: center; }
        #preview { width: 100%; border-radius: 8px; border: 1px solid #444; margin-top: 15px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #4caf50; margin-bottom: 20px;">CITY SCHOOL Bulk App</h2>

    <div class="section">
        <h3>၁။ အများကြီး တစ်ခါတည်း ထုတ်ရန် (Bulk)</h3>
        <label>CSV ဖိုင် ရွေးပေးပါ ကိုကို:</label>
        <input type="file" id="csvInput" accept="*/*">
        <button id="bulkBtn" class="btn-bulk">စတစ်ကာအားလုံး (ZIP) ထုတ်မည်</button>
        <div id="status"></div>
    </div>

    <div class="section">
        <h3>၂။ တစ်ပုံချင်းစီ စိတ်ကြိုက်ထုတ်ရန် (Manual)</h3>
        <label>Unit Type:</label>
        <select id="template">
            <option value="1000158560.png" selected>Outdoor Unit</option>
            <option value="1000158556.png">Indoor Unit</option>
        </select>
        
        <label>Unit ID:</label><input type="text" id="unitId" value="CU G-01">
        <label>Room:</label><input type="text" id="room" value="M & E Control Room">
        <label>Brand:</label><input type="text" id="brand" value="SUMMIT">
        <label>Type:</label><input type="text" id="type" value="Wall-Mounted">
        <label>HP:</label><input type="text" id="cooling" value="2">
        <label>Gas:</label><input type="text" id="refrigerant" value="R-32a">

        <button onclick="downloadSingle()" class="btn-single">လက်ရှိပုံကို ဒေါင်းလုဒ်ဆွဲမည်</button>
    </div>

    <img id="preview" src="" alt="Preview">
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');
    const templateSelect = document.getElementById('template');
    const bulkBtn = document.getElementById('bulkBtn');
    const statusDiv = document.getElementById('status');

    function drawSticker(data, selectedTemplate) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = selectedTemplate + "?t=" + new Date().getTime();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "black";
                ctx.font = "bold 52px sans-serif";
                ctx.lineWidth = 3;

                // X အမှတ်များကို ပုံအသစ်၏ မျဉ်းကြောင်းအစများနှင့် ချိန်ညှိထားပါသည်
                const xLeft = 480; 
                const xHP = 400; // Capacity (HP) မျဉ်းအစ
                const xGas = 650; // Refrigerant (Gas) မျဉ်းအစ
                const lineEnd = 960;

                if (selectedTemplate === "1000158560.png") {
                    // Outdoor Alignment
                    ctx.fillText(data.unitId, xLeft, 130);
                    ctx.fillText(data.room, xLeft, 195);
                    ctx.fillText(data.brand, xLeft, 260);
                    ctx.fillText(data.type, xLeft, 325);
                    
                    // HP နှင့် Gas ကို သက်ဆိုင်ရာ မျဉ်းကြောင်းပေါ် တင်ခြင်း
                    ctx.fillText(data.cooling, xHP + 10, 395);
                    ctx.fillText(data.refrigerant, xGas + 10, 395);

                    // Running Pressure (Y=460) နှင့် Ampere (Y=525) အတွက် မျဉ်းကြောင်းများသာ ဆွဲထားပါမည် (Softpen ဖြင့် ရေးရန်)
                    const drawUnderline = (x, y, end) => {
                        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(end, y); ctx.stroke();
                    };
                    drawUnderline(400, 465, 485); // Pressure မျဉ်း
                    drawUnderline(640, 530, 725); // Ampere မျဉ်း
                } else {
                    // Indoor Alignment
                    ctx.fillText(data.unitId, xLeft, 130);
                    ctx.fillText(data.room, xLeft, 235);
                    
                    // Brand ရှေ့က ( : ) ကို X=400 နေရာတွင် ချိန်ထားပါသည်
                    ctx.fillText(":", 400, 345);
                    ctx.fillText(data.brand, xLeft, 345);
                    
                    ctx.fillText(data.type, xLeft, 455);
                    ctx.fillText(data.cooling + " HP", 720, 560);
                    ctx.fillText(data.refrigerant, 720, 675);

                    // Indoor Underlines
                    const drawLine = (x, y) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(lineEnd, y); ctx.stroke(); };
                    drawLine(xLeft, 142); drawLine(xLeft, 247); drawLine(xLeft, 357); drawLine(xLeft, 467);
                }
                resolve();
            };
        });
    }

    async function updatePreview() {
        const data = {
            unitId: document.getElementById('unitId').value,
            room: document.getElementById('room').value,
            brand: document.getElementById('brand').value,
            type: document.getElementById('type').value,
            cooling: document.getElementById('cooling').value,
            refrigerant: document.getElementById('refrigerant').value
        };
        await drawSticker(data, templateSelect.value);
        previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
    }

    function downloadSingle() {
        const link = document.createElement('a');
        link.download = (document.getElementById('unitId').value || 'Sticker') + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }

    bulkBtn.addEventListener('click', async () => {
        const file = document.getElementById('csvInput').files[0];
        if (!file) { alert("ကိုကို... CSV ဖိုင်အရင်ရွေးပေးပါရှင်"); return; }
        bulkBtn.disabled = true;
        const text = await file.text();
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
        const zip = new JSZip();
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length < 5) continue;
            const data = {
                unitId: cols[0]?.trim(), room: cols[1]?.trim(), brand: cols[2]?.trim(),
                type: cols[3]?.trim(), cooling: cols[4]?.trim(), refrigerant: cols[5]?.trim()
            };
            await drawSticker(data, templateSelect.value);
            const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.95));
            zip.file(data.unitId.replace(/[/\\?%*:|"<>]/g, '-') + ".jpg", blob);
            statusDiv.innerText = `${i} / ${lines.length - 1} ပုံ ပြီးပါပြီ ကိုကို...`;
        }
        const content = await zip.generateAsync({type: "blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = (templateSelect.value.includes("1000158560") ? "Outdoor_Stickers.zip" : "Indoor_Stickers.zip");
        link.click();
        statusDiv.innerText = "အောင်မြင်စွာ ထုတ်ပြီးပါပြီ ကိုကို!";
        bulkBtn.disabled = false;
    });

    document.querySelectorAll('input, select').forEach(el => el.oninput = updatePreview);
    window.onload = updatePreview;
</script>
</body>
</html>
