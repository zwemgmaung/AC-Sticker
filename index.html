<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker - Bulk & Manual App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #1a1a1a; text-align: center; color: white; }
        .container { max-width: 550px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .section { text-align: left; margin-bottom: 20px; padding: 15px; border: 1px solid #444; border-radius: 10px; background: #333; }
        h3 { color: #4caf50; margin-top: 0; border-bottom: 1px solid #555; padding-bottom: 5px; font-size: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #ccc; }
        input, select { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 6px; font-size: 14px; background: #444; color: white; box-sizing: border-box; margin-bottom: 10px; }
        button { color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-bulk { background: #1a73e8; margin-bottom: 10px; }
        .btn-single { background: #28a745; }
        #status { margin-top: 10px; font-size: 13px; color: #ffeb3b; text-align: center; }
        #preview { width: 100%; border-radius: 8px; border: 1px solid #444; margin-top: 15px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #4caf50; margin-bottom: 20px;">AC Sticker Master App</h2>

    <div class="section">
        <h3>၁။ အများကြီး တစ်ခါတည်း ထုတ်ရန် (Bulk)</h3>
        <label>CSV ဖိုင် ရွေးပေးပါ ကိုကို:</label>
        <input type="file" id="csvInput" accept="*/*">
        <button id="bulkBtn" class="btn-bulk">စတစ်ကာများအားလုံး (ZIP) ထုတ်မည်</button>
        <div id="status"></div>
    </div>

    <div class="section">
        <h3>၂။ တစ်ပုံချင်းစီ စိတ်ကြိုက်ထုတ်ရန် (Manual)</h3>
        <label>Unit Type:</label>
        <select id="template">
            <option value="1000158560.png" selected>Outdoor Unit</option>
            <option value="1000158556.png">Indoor Unit</option>
        </select>
        
        <label>Unit ID:</label>
        <input type="text" id="unitId" value="CU G-01">
        
        <label>Room:</label>
        <input type="text" id="room" value="M & E Control Room">
        
        <label>Brand:</label>
        <select id="brand">
            <option selected>Summit</option><option>Daikin</option><option>Chigo</option><option>Hisense</option><option>Shimazu</option>
        </select>

        <label>Type:</label>
        <select id="type">
            <option selected>Wall-Mounted</option><option>Ceiling Cassette</option>
        </select>

        <label>HP / Gas:</label>
        <div style="display:flex; gap:10px;">
            <input type="text" id="cooling" value="2" placeholder="HP">
            <input type="text" id="refrigerant" value="R-32a" placeholder="Gas">
        </div>

        <button onclick="downloadSingle()" class="btn-single">လက်ရှိပုံကို ဒေါင်းလုဒ်ဆွဲမည်</button>
    </div>

    <img id="preview" src="" alt="Preview">
</div>

<canvas id="mainCanvas" width="1080" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');
    const templateSelect = document.getElementById('template');
    const bulkBtn = document.getElementById('bulkBtn');
    const statusDiv = document.getElementById('status');

    function drawSticker(data, selectedTemplate) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = selectedTemplate + "?t=" + new Date().getTime();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "black";
                ctx.font = "bold 56px sans-serif";

                if (selectedTemplate === "1000158560.png") {
                    const xStart = 465; const xMid = 630;
                    ctx.fillText(data.unitId, xStart, 128);
                    ctx.fillText(data.room, xStart, 196);
                    ctx.fillText(data.brand, xStart, 269);
                    ctx.fillText(data.type, xStart, 347);
                    ctx.fillText(data.cooling, xMid + 50, 425);
                    ctx.fillText(data.refrigerant, xMid + 30, 493);
                } else {
                    const xLeft = 465; const xRight = 720;
                    ctx.fillText(data.unitId, xLeft, 125);
                    ctx.fillText(data.room, xLeft, 235);
                    ctx.fillText(data.brand, xLeft, 345);
                    ctx.fillText(data.type, xLeft, 455);
                    ctx.fillText(data.cooling + " HP", xRight, 555);
                    ctx.fillText(data.refrigerant, xRight, 670);
                }
                resolve();
            };
        });
    }

    async function updatePreview() {
        const data = {
            unitId: document.getElementById('unitId').value,
            room: document.getElementById('room').value,
            brand: document.getElementById('brand').value,
            type: document.getElementById('type').value,
            cooling: document.getElementById('cooling').value,
            refrigerant: document.getElementById('refrigerant').value
        };
        await drawSticker(data, templateSelect.value);
        previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
    }

    function downloadSingle() {
        const link = document.createElement('a');
        link.download = (document.getElementById('unitId').value || 'Sticker') + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }

    // Bulk Zip Generation (ကိုကို့ရဲ့ CSV အသစ် Column A ကနေ စဖတ်ဖို့ ပြင်ထားပါတယ်)
    bulkBtn.addEventListener('click', async () => {
        const file = document.getElementById('csvInput').files[0];
        if (!file) { alert("ကိုကို... CSV ဖိုင်အရင်ရွေးပေးပါရှင်"); return; }

        bulkBtn.disabled = true;
        statusDiv.innerText = "ဖိုင်ထုတ်နေပါပြီ... ခဏစောင့်ပါရှင်";
        
        try {
            const text = await file.text();
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
            const zip = new JSZip();
            const selectedTemplate = templateSelect.value;

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length < 5) continue;

                // S/N မပါသောကြောင့် Column Index များကို 0 မှ စတွက်ပါသည်
                const data = {
                    unitId: cols[0]?.trim() || "",    // Column A
                    room: cols[1]?.trim() || "",      // Column B
                    brand: cols[2]?.trim() || "",     // Column C
                    type: cols[3]?.trim() || "",      // Column D
                    cooling: cols[4]?.trim() || "",   // Column E
                    refrigerant: cols[5]?.trim() || "" // Column F
                };

                await drawSticker(data, selectedTemplate);
                const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.95));
                const safeFileName = data.unitId.replace(/[/\\?%*:|"<>]/g, '-') + ".jpg";
                zip.file(safeFileName, blob);
                statusDiv.innerText = `${i} / ${lines.length - 1} ပုံ ပြီးပါပြီ ကိုကို...`;
            }

            const content = await zip.generateAsync({type: "blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            const zipName = (selectedTemplate.includes("1000158560.png") ? "Outdoor_Stickers.zip" : "Indoor_Stickers.zip");
            link.download = zipName;
            link.click();
            statusDiv.innerText = "အောင်မြင်စွာ ထုတ်ပြီးပါပြီ ကိုကို!";
        } catch (e) {
            statusDiv.innerText = "Error: CSV ဖိုင်ကို စစ်ဆေးပေးပါ";
        }
        bulkBtn.disabled = false;
        updatePreview();
    });

    document.querySelectorAll('input, select').forEach(el => el.oninput = updatePreview);
    window.onload = updatePreview;
</script>
</body>
</html>
