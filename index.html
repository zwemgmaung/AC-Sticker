<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Sticker App - Final Corrected</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f0f4f8; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .form-group { text-align: left; margin-bottom: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 2px; font-size: 12px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #preview { width: 100%; border-radius: 5px; border: 1px solid #ddd; margin-top: 15px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #1a73e8; margin: 0 0 15px 0;">AC Sticker App</h2>
    
    <div class="form-group">
        <label>Unit Type:</label>
        <select id="template">
            <option value="1000158560.png">Outdoor Unit (Template 1)</option>
            <option value="1000158556.png" selected>Indoor Unit (Template 2)</option>
        </select>
    </div>

    <div class="form-group"><label>Unit ID:</label><input type="text" id="unitId" value="FCU G-01"></div>
    <div class="form-group"><label>Room:</label><input type="text" id="room" value="M & E Control Room"></div>
    
    <div class="form-group">
        <label>Brand:</label>
        <select id="brand">
            <option value="Daikin">Daikin</option>
            <option value="Summit" selected>Summit</option>
            <option value="Chigo">Chigo</option>
            <option value="Hisense">Hisense</option>
            <option value="Shimazu">Shimazu</option>
        </select>
    </div>

    <div class="form-group">
        <label>Type:</label>
        <select id="type">
            <option value="Wall-Mounted" selected>Wall-Mounted</option>
            <option value="Ceiling Cassette">Ceiling Cassette</option>
        </select>
    </div>

    <div class="form-group">
        <label>Cooling Capacity (HP):</label>
        <select id="cooling">
            <option value="1.5 HP">1.5 HP</option>
            <option value="2.0 HP" selected>2.0 HP</option>
            <option value="3.0 HP">3.0 HP</option>
        </select>
    </div>

    <div class="form-group">
        <label>Refrigerant Type:</label>
        <select id="refrigerant">
            <option value="R-22a">R-22a</option>
            <option value="R-32a" selected>R-32a</option>
            <option value="R-410a">R-410a</option>
        </select>
    </div>

    <button onclick="downloadImage()">DOWNLOAD HD STICKER</button>
    <img id="preview" src="" alt="Preview">
</div>

<canvas id="mainCanvas" width="1000" height="1350"></canvas>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const previewImg = document.getElementById('preview');
    const templateSelect = document.getElementById('template');

    function update() {
        const img = new Image();
        img.src = templateSelect.value;
        img.onload = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "black";
            ctx.font = "bold 44px sans-serif";
            const x = 440; // ညာဘက်ခြမ်း စတင်မည့်နေရာ

            if (templateSelect.value === "1000158560.png") {
                // Outdoor Unit (Template 1)
                ctx.fillText(document.getElementById('unitId').value, x, 120);
                ctx.fillText(document.getElementById('room').value, x, 195);
                ctx.fillText(document.getElementById('brand').value, x, 270);
                ctx.fillText(document.getElementById('type').value, x, 345);
                ctx.fillText(document.getElementById('cooling').value, x, 420);
                ctx.fillText(document.getElementById('refrigerant').value, x, 570); // Pressure နေရာကျော်ပြီး ညှိထားပါတယ်
            } else {
                // Indoor Unit (Template 2) - ကိုကိုပို့တဲ့ Screenshot အရ ပြန်ညှိထားတာ
                ctx.fillText(document.getElementById('unitId').value, x, 145);
                ctx.fillText(document.getElementById('room').value, x, 255);
                ctx.fillText(document.getElementById('brand').value, x, 365);
                ctx.fillText(document.getElementById('type').value, x, 475);
                ctx.fillText(document.getElementById('cooling').value, x, 585);
                ctx.fillText(document.getElementById('refrigerant').value, x, 695);
            }
            previewImg.src = canvas.toDataURL('image/jpeg', 0.8);
        };
    }

    document.querySelectorAll('input, select').forEach(el => el.oninput = update);
    function downloadImage() {
        const link = document.createElement('a');
        link.download = (document.getElementById('unitId').value || 'Sticker') + '.jpg';
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.click();
    }
    window.onload = update;
</script>
</body>
</html>
